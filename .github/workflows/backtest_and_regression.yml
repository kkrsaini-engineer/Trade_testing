name: Institutional Backtest & Regression Check

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Historical period to backtest"
        required: true
        default: "2y"
        type: choice
        options:
          - "3mo"
          - "6mo"
          - "1y"
          - "2y"
          - "5y"
          - "10y"
      realistic_costs:
        description: "Deduct real Indian delivery costs (STT, stamp, exchange, DP, slippage)"
        required: true
        default: true
        type: boolean
      universe:
        description: "Stocks to test: default = 11 large caps; top50/top100 = most liquid watchlist stocks (slower: ~1.5h / ~3h)"
        required: true
        default: "default"
        type: choice
        options:
          - "default"
          - "top50"
          - "top100"
      signal_path:
        description: "live = same scan as the production nightly scan; universe = two-pass path production does NOT run"
        required: true
        default: "live"
        type: choice
        options:
          - "live"
          - "universe"
      buy_only:
        description: "Experiment: skip all SELL trades"
        required: true
        default: false
        type: boolean
      max_new_entries_per_day:
        description: "Experiment: max new positions per morning (0 = no cap, same as live)"
        required: true
        default: "0"
        type: string
      min_target_to_cost:
        description: "Experiment: skip trades whose target move is < X times its costs (0 = off, same as live)"
        required: true
        default: "0"
        type: string
      set_baseline:
        description: "Save this run as the new regression baseline (instead of comparing)"
        required: true
        default: false
        type: boolean

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Institutional Backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/run_backtest.py --period "${{ inputs.period }}" --universe "${{ inputs.universe }}" --signal-path "${{ inputs.signal_path }}" --max-new-entries-per-day "${{ inputs.max_new_entries_per_day }}" --min-target-to-cost "${{ inputs.min_target_to_cost }}" ${{ inputs.buy_only && '--buy-only' || '' }} ${{ inputs.realistic_costs && '--realistic-costs' || '' }}

      - name: Run Regression Check (compare against baseline)
        if: ${{ inputs.set_baseline == false }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/regression_check.py

      - name: Set as new baseline
        if: ${{ inputs.set_baseline == true }}
        run: PYTHONPATH=. python scripts/regression_check.py --set-baseline

      - name: Commit updated reports back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- reports/
          git diff --staged --quiet || git commit -m "Backtest + regression update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          # 2026-10-07: retry like the other workflows — a Daily Scan /
          # Paper Trading push in the meantime used to fail this step.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "Push rejected — pulling and retrying ($i/5)..."
            git pull --rebase origin main
            sleep 30
          done
          echo "::error::Push failed after 5 attempts — results are still in this log and on Telegram."
          exit 1
