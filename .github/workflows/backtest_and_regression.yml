name: Institutional Backtest & Regression Check

on:
  workflow_dispatch:
    inputs:
      period:
        description: "Historical period to backtest"
        required: true
        default: "2y"
        type: choice
        options:
          - "3mo"
          - "6mo"
          - "1y"
          - "2y"
          - "5y"
          - "10y"
      realistic_costs:
        description: "Deduct real Indian delivery costs (STT, stamp, exchange, DP, slippage)"
        required: true
        default: true
        type: boolean
      set_baseline:
        description: "Save this run as the new regression baseline (instead of comparing)"
        required: true
        default: false
        type: boolean

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Institutional Backtest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/run_backtest.py --period "${{ inputs.period }}" ${{ inputs.realistic_costs && '--realistic-costs' || '' }}

      - name: Run Regression Check (compare against baseline)
        if: ${{ inputs.set_baseline == false }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/regression_check.py

      - name: Set as new baseline
        if: ${{ inputs.set_baseline == true }}
        run: PYTHONPATH=. python scripts/regression_check.py --set-baseline

      - name: Commit updated reports back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- reports/
          git diff --staged --quiet || git commit -m "Backtest + regression update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
