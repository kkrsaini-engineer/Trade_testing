name: Daily Scan

on:
  schedule:
    - cron: "0 15 * * *"  # 8:30 PM IST (15:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the NSE trading-day check (testing only, e.g. on a market holiday)"
        required: true
        default: false
        type: boolean

concurrency:
  group: repo-write-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 2026-10-06: fundamentals change quarterly — reuse last run's
      # downloaded copies (<= 7 days old, see scripts/generate_full_report.py)
      # instead of re-fetching all ~2,400 every night. Restores the most
      # recent cache; a fresh one is saved automatically at the end.
      - name: Restore fundamentals cache
        uses: actions/cache@v4
        with:
          path: storage/cache/fundamentals
          key: fundamentals-${{ github.run_id }}
          restore-keys: |
            fundamentals-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Full Report Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/generate_full_report.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Commit updated report back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- reports/ storage/trades/ storage/reports/
          # 2026-10-07: GitHub rejects any file over 100 MB (GH001) and no
          # retry can fix that — reports/full_report.csv hit 102 MB and every
          # push from 2026-09-22 failed, losing the whole scan incl.
          # candidates_order.json. Unstage any oversized file (with a loud
          # error) so the rest of the scan still gets pushed.
          for f in $(git diff --cached --name-only); do
            if [ -f "$f" ] && [ "$(stat -c %s "$f")" -gt 99000000 ]; then
              echo "::error::$f is $(stat -c %s "$f") bytes (GitHub limit 100 MB) — NOT committed this run; the rest of the scan is."
              git reset -q -- "$f"
            fi
          done
          git diff --staged --quiet || git commit -m "Daily scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          PUSH_OK=false
          for i in $(seq 1 12); do
            if git push 2> "$RUNNER_TEMP/push_err.txt"; then
              PUSH_OK=true
              break
            fi
            cat "$RUNNER_TEMP/push_err.txt"
            if grep -q "GH001" "$RUNNER_TEMP/push_err.txt"; then
              echo "::error::GitHub rejected a file over 100 MB (GH001) — retrying cannot fix this."
              break
            fi
            echo "Push rejected (likely a concurrent workflow pushed first) — pulling and retrying ($i/12)..."
            git stash --include-untracked
            git pull --rebase origin main
            git stash pop || true
            sleep 300
          done
          if [ "$PUSH_OK" = false ]; then
            echo "::error::Push failed — commit exists locally but was NOT pushed to remote. Data may be lost unless a future run recovers it."
            exit 1
          fi
