name: Diagnose CMF-MFI Daily Window (no fields — just click Run)

# No inputs at all — every value is fixed below. Click "Run workflow"
# and go, nothing to fill in or get wrong.
on:
  workflow_dispatch: {}

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run diagnose_indicator_snapshot.py (daily candles, CMF/MFI window check)
        run: |
          PYTHONPATH=. python scripts/diagnose_indicator_snapshot.py \
            --symbol "HDFCBANK.NS" \
            --interval "1d" \
            --period "3mo" \
            --show-cmf-mfi-window
